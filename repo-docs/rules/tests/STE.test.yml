# Cases for the opt-in STE style. Run them with `vale test --coverage` from
# Vale 3.24 or later.

- name: a passive construction is flagged
  rule: ../STE/Passive.yml
  input: The file is generated by the build.
  contains: STE.Passive
- name: an adjective after is is not passive
  rule: ../STE/Passive.yml
  input: The light is red.
  absent: STE.Passive

- name: a seven-sentence paragraph is over the limit
  rule: ../STE/ParagraphLength.yml
  input: One. Two. Three. Four. Five. Six. Seven.
  contains: STE.ParagraphLength
- name: a six-sentence paragraph is at the limit
  rule: ../STE/ParagraphLength.yml
  input: One. Two. Three. Four. Five. Six.
  absent: STE.ParagraphLength
