# Example Vale config for the RepoDocs and STE styles, for editor feedback.
# Copy this file into your project root as `.vale.ini`, copy the RepoDocs/
# (and STE/, if you want it) folders next to it under a styles folder, and set
# StylesPath to that folder. check-docs.js builds the same config itself, so a
# repository doesn't need this file to be checked, only to see the findings in
# an editor.

StylesPath = .
MinAlertLevel = suggestion
SkippedScopes = script, style, pre, figure, table

[*.md]
BasedOnStyles = RepoDocs
RepoDocs.InlineColonsInParagraphs = NO

# Dates are the content of a changelog or an ADR.
[{**/CHANGELOG.md,**/docs/adr/**,**/docs/decisions/**}]
RepoDocs.History = NO

# PRODUCT.md, ARCHITECTURE.md and ADRs follow templates that use field labels
# ("**Status:** Accepted"), so only their paragraphs are checked for colons.
[{**/PRODUCT.md,**/ARCHITECTURE.md,**/docs/adr/**,**/docs/decisions/**}]
RepoDocs.InlineColons = NO
RepoDocs.InlineColonsInParagraphs = YES
