name: ci
permissions:
  contents: read
on:
  # Every branch, no list to maintain. The whole v2 rebuild once shipped
  # without CI running a single time, because the trigger named a branch the
  # work wasn't on. Replacing that with a two-name list reproduced the same
  # fragility one level up: the next long-lived branch gets no CI until
  # someone remembers this file exists. A wildcard cannot go stale.
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install vale (ai-prose-slop's one external dependency)
        shell: bash
        run: |
          VALE_VERSION=3.15.1
          mkdir -p "$HOME/.local/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="vale_${VALE_VERSION}_Windows_64-bit.zip"
            curl --fail --show-error --location "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
            echo "3395fca0ddfb10a9b6caa28e091d5df709b1d6b6579afb7dece852cad89b94f3  /tmp/${ASSET}" | sha256sum --check
            unzip -o "/tmp/${ASSET}" -d "$HOME/.local/bin" vale.exe
            # GITHUB_PATH entries on Windows must be Windows-style
            # (C:\...) — a bash-native POSIX path like /c/Users/... is
            # invisible to Node's spawnSync('vale', ...) later in this same
            # job, which reads the native Windows PATH env var. Verified
            # locally: PATH="$(cygpath -u ...):$PATH" resolves `vale` in
            # bash but a raw POSIX path added to a Windows PATH does not
            # resolve for non-bash consumers.
            cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            ASSET="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
            curl --fail --show-error --location "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
            echo "c024d9c157874fb043d4f24a055d60050d1bb18755251f590593eed5bace1857  /tmp/${ASSET}" | sha256sum --check
            tar -xzf "/tmp/${ASSET}" -C "$HOME/.local/bin" vale
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify vale is on PATH
        # Fails the job loudly if the install step above didn't actually
        # make vale reachable, instead of letting run-tests.mjs's graceful
        # local-dev skip silently hide a broken CI leg.
        run: vale --version
      - name: Install gitleaks (backend-engineering's + the pre-commit hook's secret scanner)
        shell: bash
        run: |
          GITLEAKS_VERSION=8.30.1
          mkdir -p "$HOME/.local/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
            curl --fail --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
            echo "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e  /tmp/${ASSET}" | sha256sum --check
            unzip -o "/tmp/${ASSET}" -d "$HOME/.local/bin" gitleaks.exe
            # Same Windows-style-path requirement as the vale install above.
            cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            OS_NAME=$([ "$RUNNER_OS" = "macOS" ] && echo darwin || echo linux)
            ASSET="gitleaks_${GITLEAKS_VERSION}_${OS_NAME}_x64.tar.gz"
            curl --fail --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
            if [ "$OS_NAME" = "darwin" ]; then EXPECTED=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709; else EXPECTED=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb; fi
            echo "${EXPECTED}  /tmp/${ASSET}" | sha256sum --check
            tar -xzf "/tmp/${ASSET}" -C "$HOME/.local/bin" gitleaks
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify gitleaks is on PATH
        run: gitleaks version
      - name: Suite tests (fixtures, registry cross-check, schema units, contract drift)
        run: node scripts/run-tests.mjs
