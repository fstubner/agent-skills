name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  runtime-smoke:
    uses: ./.github/workflows/runtime-smoke.yml

  build-once:
    needs: [tests, runtime-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version, changelog, and generated packages
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v${VERSION_VALUE}"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          grep -F "## ${VERSION_VALUE}" CHANGELOG.md
          node scripts/gen-plugin-bundles.mjs --check
          node scripts/check-marketplace-standards.mjs --offline
      - name: Build the tagged commit exactly once
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          mkdir dist
          git archive --format=tar --prefix="agent-skills-${VERSION_VALUE}/" "$GITHUB_SHA" | gzip -n > "dist/agent-skills-${VERSION_VALUE}.tar.gz"
          cd dist
          sha256sum "agent-skills-${VERSION_VALUE}.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-package
          path: dist
      - name: Verify and publish the exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          PRERELEASE=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${PRERELEASE[@]}" ./*

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download, verify, and execute the published package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/published" "$RUNNER_TEMP/extracted"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          sha256sum --check SHA256SUMS
          tar -xzf agent-skills-*.tar.gz -C "$RUNNER_TEMP/extracted"
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-installed-package.mjs --search-root "$RUNNER_TEMP/extracted"

