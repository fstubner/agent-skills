version: 2

# Only the repo root and CI are watched for updates.
#
# fixtures/ is deliberately absent. Those manifests are test data, not
# dependencies: they exist so the project classifier can recognise a
# Django/Express/Prisma project from its manifest shape. Nothing is installed
# from them and no fixture code runs. Listing them here produced a steady
# stream of version-bump PRs against versions that are pinned old ON PURPOSE
# — several are the very thing a fixture asserts a checker detects.
#
# eval/ is absent for the same reason, with an extra multiplier: every run
# copies its fixture into a committed, hash-bound bundle. A single two-line
# requirements.txt in one fixture became 56 open security alerts — the
# fixture, the grader fixture, and one copy per run — and would have grown by
# four with every future run. Fixture manifests therefore declare no
# third-party dependencies; the source can import whatever the scenario needs,
# since nothing is ever installed.
#
# Note this file governs update PRs only. Security ALERTS come from the
# dependency graph and ignore it. The 56 above were dismissed as `not_used`,
# which is exactly what that reason is for; if a wave of alerts ever appears
# under eval/, check it is fixture data and dismiss the same way rather than
# bumping a pin that a fixture deliberately holds old.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /tooling/runtime-smoke
    schedule:
      interval: weekly
    groups:
      harness-clis:
        patterns:
          - '@anthropic-ai/claude-code'
          - '@google/gemini-cli'
          - '@openai/codex'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
