version: 2

# Only the repo root and CI are watched for updates.
#
# fixtures/ is deliberately absent. Those manifests are test data, not
# dependencies: they exist so the project classifier can recognise a
# Django/Express/Prisma project from its manifest shape. Nothing is installed
# from them and no fixture code runs. Listing them here produced a steady
# stream of version-bump PRs against versions that are pinned old ON PURPOSE
# — several are the very thing a fixture asserts a checker detects.
#
# eval/ is absent for the same reason, with an extra multiplier: every run
# copies its fixture into a committed, hash-bound bundle. A single two-line
# requirements.txt in one fixture became 56 open security alerts — the
# fixture, the grader fixture, and one copy per run — and would have grown by
# four with every future run. Fixture manifests therefore declare no
# third-party dependencies; the source can import whatever the scenario needs,
# since nothing is ever installed.
#
# Note this file governs update PRs only. Security ALERTS come from the
# dependency graph and ignore it. The 56 above were dismissed as `not_used`,
# which is exactly what that reason is for; if a wave of alerts ever appears
# under eval/, check it is fixture data and dismiss the same way rather than
# bumping a pin that a fixture deliberately holds old.
#
# "Absent" was never the same thing as "excluded", and the comment above was
# wrong about that for as long as it has existed. `directory: /` scans the
# whole tree beneath it, so seven version-bump PRs against eval/ fixtures and
# archived run bundles were opened anyway and closed by hand on 2026-09-07.
#
# There is no npm entry for / any more, because there is nothing there to
# watch: the repository has no root package.json, and the only npm manifest
# outside eval/ and fixtures/ that declares a dependency is
# tooling/runtime-smoke, which has its own entry below. Everything that entry
# ever found was fixture data. Adding `exclude-paths: [eval/**, fixtures/**]`
# to it was tried first and failed the job outright — with the fixtures
# excluded it had no manifest left at all and reported
# `dependency_file_not_found: /package.json not found`.
#
# None of this touches SECURITY updates, which ignore both the directory list
# and exclude-paths (dependabot/dependabot-core#14408). One of those is the
# other reason the Dependabot job fails: it tries to patch qs in an archived
# run bundle, cannot, because that fixture pins express@4.22.2 which requires
# qs@~6.15.1, and exits non-zero. Dismissing those alerts as `not_used` is
# what stops it. There is no configuration for it.
updates:
  - package-ecosystem: npm
    directory: /tooling/runtime-smoke
    schedule:
      interval: weekly
    groups:
      harness-clis:
        patterns:
          - '@anthropic-ai/claude-code'
          - '@google/gemini-cli'
          - '@openai/codex'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
