name: deploy

on:
  push:
    branches: [main]

jobs:
  # Seconds. Nothing expensive starts until this is green.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint

  # Under a minute.
  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  # ~22 minutes, and now it only runs against code that already lints and
  # passes its unit tests.
  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:integration

  staging:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Build image
        run: docker build -t registry.internal/ledger-api:${{ github.sha }} .
      - name: Deploy
        run: ./scripts/deploy.sh staging registry.internal/ledger-api:${{ github.sha }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./scripts/deploy.sh production registry.internal/ledger-api:${{ github.sha }}
