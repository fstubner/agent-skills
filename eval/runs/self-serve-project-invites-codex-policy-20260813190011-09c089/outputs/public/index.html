<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Create project invitation</title><style>body{font:1rem system-ui;max-width:38rem;margin:2rem auto;padding:0 1rem}label{display:block;margin-top:1rem}input,select,button{font:inherit;padding:.5rem;width:100%;box-sizing:border-box}button{margin-top:1.25rem}.result{margin-top:1rem;padding:1rem;background:#eef7ee;overflow-wrap:anywhere}.error{color:#a00}</style></head><body><main><h1>Create project invitation</h1><p>Generate a link to share with a project member.</p><form id="invite-form"><label for="account">Your account name</label><input id="account" required autocomplete="username"><label for="project">Project ID</label><input id="project" value="demo" required><label for="email">Invitee email</label><input id="email" type="email" required autocomplete="email"><label for="role">Role</label><select id="role"><option value="viewer">Viewer</option><option value="editor">Editor</option></select><label for="key">Idempotency key</label><input id="key" required aria-describedby="key-help"><small id="key-help">Reuse this key to safely retry the same invitation.</small><button type="submit">Create invite link</button></form><div id="message" role="status" aria-live="polite"></div></main><script>const form=document.querySelector('#invite-form'),message=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();message.className='';message.textContent='Creating…';try{const r=await fetch('/api/projects/'+encodeURIComponent(project.value)+'/invites',{method:'POST',headers:{Authorization:'Bearer '+account.value,'Content-Type':'application/json','Idempotency-Key':key.value},body:JSON.stringify({email:email.value,role:role.value})});const data=await r.json();if(!r.ok)throw Error(data.message);message.className='result';message.textContent='Invite link: '+data.inviteUrl}catch(err){message.className='error';message.textContent=err.message}});</script></body></html>
