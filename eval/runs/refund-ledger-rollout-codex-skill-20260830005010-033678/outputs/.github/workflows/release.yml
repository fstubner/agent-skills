name: release
on: workflow_dispatch
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - run: npm run build && mv refund-ledger.tgz refund-ledger-${{ github.sha }}.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: refund-ledger-${{ github.sha }}
          path: refund-ledger-${{ github.sha }}.tgz
