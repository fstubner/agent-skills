name: deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t registry.internal/ledger-api:${{ github.sha }} .
      - name: Deploy
        run: ./scripts/deploy.sh production registry.internal/ledger-api:${{ github.sha }}
      - name: Smoke check
        run: |
          response=$(curl -sS https://ledger.internal/entries/smoke)
          echo "Response: $response"
          echo "$response" | jq -e '.id == "smoke" and .amount == 0' > /dev/null || (echo "Smoke check failed" && exit 1)
