name: deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t registry.internal/ledger-api:${{ github.sha }} .
      - name: Deploy
        run: ./scripts/deploy.sh production registry.internal/ledger-api:${{ github.sha }}
      - name: Smoke check
        run: |
          response=$(curl -sS -w "\n%{http_code}" https://ledger.internal/smoke)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          if [ "$http_code" != "200" ]; then
            echo "Smoke check failed with HTTP $http_code"
            echo "Response: $body"
            exit 1
          fi
          if ! echo "$body" | grep -q '"status":"ok"'; then
            echo "Smoke check returned invalid response"
            echo "Response: $body"
            exit 1
          fi
          echo "Smoke check passed: $body"
