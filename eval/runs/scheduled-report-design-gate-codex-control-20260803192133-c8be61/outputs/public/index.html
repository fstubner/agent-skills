<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheduled reports</title>
<style>body{font:16px system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:920px;margin:48px auto;padding:0 20px}h1{font-size:34px;margin-bottom:8px}.muted{color:#667085}.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:24px;margin:24px 0;box-shadow:0 4px 18px #1018280b}form{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{display:flex;flex-direction:column;gap:6px;font-weight:600}input,select{font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:8px}button{border:0;border-radius:8px;padding:11px 16px;background:#356ae6;color:white;font-weight:700;cursor:pointer}.full{grid-column:1/-1}.schedule{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #eaecf0;padding:18px 0}.schedule:first-child{border:0}.actions{display:flex;gap:8px}button.secondary{background:#eef2ff;color:#304b9b}button.danger{background:#fff0f0;color:#c0362c}@media(max-width:650px){form{grid-template-columns:1fr}.full{grid-column:auto}.schedule{align-items:flex-start;flex-direction:column}}</style></head>
<body><main><p class="muted">ACTIVITY SERVICE</p><h1>Scheduled reports</h1><p class="muted">Send useful account updates to your team on a daily or weekly cadence.</p>
<section class="card"><h2>Create a delivery</h2><form id="form"><label>Report<select id="reportId"></select></label><label>Frequency<select id="frequency"><option value="daily">Every day</option><option value="weekly">Every week</option></select></label><label id="dayLabel" hidden>Day<select id="dayOfWeek"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="0">Sunday</option></select></label><label>Time (UTC)<input id="time" type="time" value="09:00" required></label><label class="full">Recipients <span class="muted">comma-separated email addresses</span><input id="recipients" placeholder="you@example.com, team@example.com" required></label><div class="full"><button>Schedule report</button><span id="message" class="muted"></span></div></form></section>
<section class="card"><h2>Your deliveries</h2><div id="list"><p class="muted">Loading…</p></div></section></main>
<script>const $=id=>document.getElementById(id);async function api(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong');return d}function format(s){return s.frequency==='daily'?`Daily at ${s.time} UTC`:`Weekly on ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][s.dayOfWeek]} at ${s.time} UTC`}async function load(){const d=await api('/api/schedules');$('list').innerHTML=d.schedules.length?d.schedules.map(s=>`<div class="schedule"><div><strong>${s.reportId}</strong><div class="muted">${format(s)} · ${s.recipients.join(', ')}</div><div class="muted">Next delivery: ${new Date(s.nextRunAt).toLocaleString()}</div></div><div class="actions"><button class="secondary" onclick="toggle('${s.id}',${!s.active})">${s.active?'Pause':'Resume'}</button><button class="danger" onclick="removeSchedule('${s.id}')">Delete</button></div></div>`).join(''):'<p class="muted">No scheduled deliveries yet.</p>'}async function toggle(id,active){await api('/api/schedules/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active})});load()}async function removeSchedule(id){if(confirm('Delete this scheduled delivery?')){await api('/api/schedules/'+id,{method:'DELETE'});load()}}$('frequency').onchange=()=>{$('dayLabel').hidden=$('frequency').value!=='weekly'};$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='';try{await api('/api/schedules',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reportId:$('reportId').value,frequency:$('frequency').value,dayOfWeek:Number($('dayOfWeek').value),time:$('time').value,recipients:$('recipients').value.split(',').map(x=>x.trim()).filter(Boolean)})});e.target.reset();$('time').value='09:00';$('message').textContent=' Scheduled.';load()}catch(err){$('message').textContent=' '+err.message}};(async()=>{const d=await api('/api/reports');$('reportId').innerHTML=d.reports.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');load()})()</script></body></html>
