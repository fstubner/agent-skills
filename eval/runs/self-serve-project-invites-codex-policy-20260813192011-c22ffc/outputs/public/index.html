<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Project invitation</title><style>body{font:1rem system-ui;max-width:36rem;margin:3rem auto;padding:0 1rem}label{display:block;margin-top:1rem}input,select,button{font:inherit;padding:.5rem;width:100%;box-sizing:border-box}button{margin-top:1.25rem;cursor:pointer}#result{margin-top:1.5rem;overflow-wrap:anywhere}</style></head>
<body><main><h1>Invite someone to a project</h1><p>Creates a shareable link; no email is sent.</p><form id="invite-form"><label for="account">Your account name</label><input id="account" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" autocomplete="username"><label for="project">Project ID</label><input id="project" value="demo-project" required><label for="email">Invitee email</label><input id="email" type="email" required autocomplete="email"><label for="role">Permission</label><select id="role"><option value="viewer">Viewer</option><option value="editor">Editor</option></select><button>Generate invite link</button></form><p id="result" role="status" aria-live="polite"></p></main><script>
const form=document.querySelector('form'), result=document.querySelector('#result');
form.addEventListener('submit',async e=>{e.preventDefault(); result.textContent='Creating invite…'; const key=crypto.randomUUID(); const project=document.querySelector('#project').value; try{const r=await fetch('/api/projects/'+encodeURIComponent(project)+'/invitations',{method:'POST',headers:{Authorization:'Bearer '+document.querySelector('#account').value,'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({email:document.querySelector('#email').value,role:document.querySelector('#role').value})}); const data=await r.json(); result.textContent=r.ok?'Invite link: '+data.inviteUrl:data.message;}catch{result.textContent='Could not create the invite. Please try again.';}});
</script></body></html>
