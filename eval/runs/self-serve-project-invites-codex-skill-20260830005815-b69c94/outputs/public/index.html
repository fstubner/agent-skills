<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create project invite</title>
<style>
:root{color:#172033;background:#f6f8fb;font:16px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}.shell{max-width:42rem;margin:0 auto;padding:32px 20px}h1{font-size:clamp(1.75rem,5vw,2rem);line-height:1.15;margin:0 0 8px}p{color:#46536a}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:24px;margin-top:24px}label{display:block;font-weight:650;margin-top:18px}input,select,button{font:inherit;min-height:46px;width:100%;border-radius:7px}input,select{border:1px solid #94a3b8;padding:10px;margin-top:6px;color:#172033;background:#fff}button{border:0;background:#2563eb;color:#fff;font-weight:700;padding:10px 16px;margin-top:24px;cursor:pointer}button:hover{background:#1d4ed8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.hint{font-size:.9rem}.error{color:#b42318;font-weight:650}.success{border-left:4px solid #166534;padding-left:16px}.link{overflow-wrap:anywhere;color:#172033}.copy{background:#e8eefc;color:#172033;margin-top:12px}.copy:hover{background:#dbe6ff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head>
<body><main class="shell"><h1>Invite someone to your project</h1><p>Choose their access level and share the link yourself. We will not send email.</p>
<form id="invite-form" class="card" novalidate><label for="project">Project ID</label><input id="project" name="project" value="demo" required><label for="email">Invitee email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><p id="email-error" class="error" role="alert"></p><label for="role">Access level</label><select id="role" name="role"><option value="viewer">Viewer — can view project content</option><option value="editor">Editor — can make changes</option></select><button id="submit" type="submit">Create invite</button><p class="hint">The invite link will appear here after creation.</p><div id="result" class="success" hidden aria-live="polite"></div></form></main>
<script>
const form=document.querySelector('#invite-form'), email=document.querySelector('#email'), error=document.querySelector('#email-error'), result=document.querySelector('#result'), button=document.querySelector('#submit');
const key=crypto.randomUUID();
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';result.hidden=true;if(!email.value.trim()||!email.validity.valid){error.textContent='Enter a valid email address.';email.focus();return}button.disabled=true;button.textContent='Creating…';try{const response=await fetch('/api/projects/'+encodeURIComponent(form.project.value.trim())+'/invites',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer admin','Idempotency-Key':key},body:JSON.stringify({email:email.value.trim(),role:form.role.value})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Could not create invite.');result.innerHTML='<strong>Invite ready</strong><p>'+data.email+' will join as '+data.role+'.</p><p class="link"><a href="'+data.inviteLink+'">'+data.inviteLink+'</a></p><button class="copy" type="button">Copy invite link</button>';result.hidden=false;result.querySelector('.copy').addEventListener('click',()=>navigator.clipboard?.writeText(data.inviteLink));}catch(e){error.textContent=e.message+' Try again.';error.focus()}finally{button.disabled=false;button.textContent='Create invite'}});
</script></body></html>
