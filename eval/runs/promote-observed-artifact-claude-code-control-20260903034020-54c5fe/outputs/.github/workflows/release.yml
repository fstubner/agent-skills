name: release
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "image=$(node scripts/build.mjs --env production)" >> $GITHUB_OUTPUT
  staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/promote.mjs --image ${{ needs.build.outputs.image }} --environment staging
      - run: node scripts/health.mjs --environment staging
  tests:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test
  production:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/promote.mjs --image ${{ needs.build.outputs.image }} --environment production
      - run: node scripts/health.mjs --environment production
