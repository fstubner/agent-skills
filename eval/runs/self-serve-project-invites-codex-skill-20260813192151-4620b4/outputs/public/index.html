<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Invite someone · Project invites</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17212b;background:#f5f7fa;line-height:1.5}body{margin:0}main{max-width:42rem;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #d6dde5;border-radius:12px;box-shadow:0 8px 24px #17212b12}h1{margin-top:0}label{display:block;font-weight:650;margin-top:1rem}input,select,button{font:inherit;width:100%;padding:.7rem;margin-top:.35rem;border:1px solid #8492a0;border-radius:6px;box-sizing:border-box}button{margin-top:1.5rem;background:#155eef;color:#fff;border:0;font-weight:700;cursor:pointer}button:focus,input:focus,select:focus{outline:3px solid #a8c7ff;outline-offset:2px}.hint{color:#52606d;font-size:.95rem}.status{margin-top:1.25rem;padding:1rem;border-radius:6px;background:#eef4ff}.status[hidden]{display:none}.status.error{background:#fff0f0;color:#8a1c1c}code{overflow-wrap:anywhere}
</style></head>
<body><main><h1>Invite to a project</h1><p class="hint">Create a shareable invitation link. No email will be sent.</p>
<form id="invite-form"><label for="account">Your account name</label><input id="account" name="account" required autocomplete="username" aria-describedby="account-help"><span id="account-help" class="hint">Use the account name from your Bearer authentication.</span>
<label for="project">Project ID</label><input id="project" name="project" required>
<label for="email">Invitee email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="role">Permission</label><select id="role" name="role"><option value="viewer">Viewer — can view</option><option value="editor">Editor — can edit</option></select>
<button type="submit">Create invite link</button></form><div id="status" class="status" role="status" aria-live="polite" hidden></div></main>
<script>const form=document.querySelector('#invite-form'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();status.hidden=true;const d=new FormData(form);try{const r=await fetch('/api/projects/'+encodeURIComponent(d.get('project'))+'/invites',{method:'POST',headers:{Authorization:'Bearer '+d.get('account'),'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({email:d.get('email'),role:d.get('role')})});const b=await r.json();if(!r.ok)throw new Error(b.message);status.className='status';status.innerHTML='Invite created. Share this link: <a href="'+b.inviteUrl+'"><code>'+b.inviteUrl+'</code></a>';status.hidden=false}catch(err){status.className='status error';status.textContent=err.message||'Could not create invite.';status.hidden=false}});</script>
</body></html>
