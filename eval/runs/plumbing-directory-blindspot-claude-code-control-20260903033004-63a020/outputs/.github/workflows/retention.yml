name: nightly-retention

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply retention
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: psql "$DATABASE_URL" -f migrations/0004_orders_retention.sql
