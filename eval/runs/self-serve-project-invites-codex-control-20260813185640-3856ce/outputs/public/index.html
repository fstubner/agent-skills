<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Invite to a project</title></head>
<body>
<main>
  <h1>Invite someone to a project</h1>
  <form id="invite-form">
    <p><label for="account">Your account name</label><br><input id="account" name="account" required autocomplete="username"></p>
    <p><label for="project">Project ID</label><br><input id="project" name="project" required></p>
    <p><label for="email">Invitee email</label><br><input id="email" name="email" type="email" required autocomplete="email"></p>
    <fieldset><legend>Permission</legend>
      <label><input type="radio" name="role" value="viewer" checked> Viewer</label>
      <label><input type="radio" name="role" value="editor"> Editor</label>
    </fieldset>
    <p><button type="submit">Create invite link</button></p>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="result" hidden><label for="invite-link">Share this invite link</label><br><input id="invite-link" readonly></p>
</main>
<script>
document.querySelector('#invite-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const status = document.querySelector('#status');
  const result = document.querySelector('#result');
  const key = crypto.randomUUID();
  status.textContent = 'Creating invite…'; result.hidden = true;
  try {
    const response = await fetch('/api/projects/' + encodeURIComponent(form.get('project')) + '/invites', {
      method: 'POST', headers: {'Authorization': 'Bearer ' + form.get('account'), 'Content-Type': 'application/json', 'Idempotency-Key': key},
      body: JSON.stringify({email: form.get('email'), role: form.get('role')})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Invite could not be created');
    document.querySelector('#invite-link').value = data.inviteUrl; result.hidden = false; status.textContent = 'Invite created. Share the link with the invitee.';
  } catch (err) { status.textContent = err.message; }
});
</script>
</body></html>
