# Example Vale config for the AIProseTells style.
# Copy this file (or merge these keys) into your project root as `.vale.ini`,
# then set StylesPath to the PARENT directory of wherever you copy the
# `AIProseTells/` folder to (not the AIProseTells folder itself — Vale appends
# BasedOnStyles's value to StylesPath, so pointing at AIProseTells/ directly
# makes it look for AIProseTells/AIProseTells/ and fail with E100).
# Here, StylesPath = . because this ini lives in the same directory
# (rules/) as AIProseTells/.

StylesPath = .
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = AIProseTells
