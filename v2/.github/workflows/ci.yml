# NOTE: active once v2/ is promoted to the repo root (paths below assume it).
name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install vale (anti-ai-slop's one external dependency)
        shell: bash
        run: |
          VALE_VERSION=3.15.1
          mkdir -p "$HOME/.local/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Windows_64-bit.zip" -o /tmp/vale.zip
            unzip -o /tmp/vale.zip -d "$HOME/.local/bin" vale.exe
            # GITHUB_PATH entries on Windows must be Windows-style
            # (C:\...) — a bash-native POSIX path like /c/Users/... is
            # invisible to Node's spawnSync('vale', ...) later in this same
            # job, which reads the native Windows PATH env var. Verified
            # locally: PATH="$(cygpath -u ...):$PATH" resolves `vale` in
            # bash but a raw POSIX path added to a Windows PATH does not
            # resolve for non-bash consumers.
            cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
            tar -xzf /tmp/vale.tar.gz -C "$HOME/.local/bin" vale
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify vale is on PATH
        # Fails the job loudly if the install step above didn't actually
        # make vale reachable, instead of letting run-tests.mjs's graceful
        # local-dev skip silently hide a broken CI leg.
        run: vale --version
      - name: Suite tests (fixtures, registry cross-check, schema units, contract drift)
        run: node scripts/run-tests.mjs
