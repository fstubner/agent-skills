# Example Vale config for the AntiAISlop style.
# Copy this file (or merge these keys) into your project root as `.vale.ini`,
# then set StylesPath to the PARENT directory of wherever you copy the
# `AntiAISlop/` folder to (not the AntiAISlop folder itself — Vale appends
# BasedOnStyles's value to StylesPath, so pointing at AntiAISlop/ directly
# makes it look for AntiAISlop/AntiAISlop/ and fail with E100).
# Here, StylesPath = . because this ini lives in the same directory
# (rules/) as AntiAISlop/.

StylesPath = .
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = AntiAISlop
